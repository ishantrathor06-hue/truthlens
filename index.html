<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TruthLens — Civic Misinformation Triage</title>
<style>
:root{--bg:#f5f7fb;--surface:#fff;--surface2:#f9fafc;--text:#172033;--muted:#667085;--line:#e5e7eb;--brand:#5b5ce2;--brand2:#eef0ff;--green:#16855b;--greenbg:#e7f7ef;--amber:#a66a00;--amberbg:#fff4d6;--red:#c33b43;--redbg:#fdebec;--blue:#3569b8;--bluebg:#eaf2ff;--shadow:0 12px 35px rgba(20,30,60,.08)}
[data-theme=dark]{--bg:#10131b;--surface:#171b25;--surface2:#1d2230;--text:#f3f5fa;--muted:#a6afc0;--line:#2b3240;--brand:#8587ff;--brand2:#252746;--green:#51d29a;--greenbg:#15392d;--amber:#f0bc58;--amberbg:#3b2d13;--red:#ff737b;--redbg:#3b1e22;--blue:#79a8ff;--bluebg:#192c4b;--shadow:0 14px 40px rgba(0,0,0,.22)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}
.app{min-height:100vh}.nav{height:70px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:10}.brand{display:flex;gap:11px;align-items:center;font-weight:850;font-size:20px}.logo{height:38px;width:38px;border-radius:12px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:900;box-shadow:0 7px 20px rgba(91,92,226,.22)}.navlinks{display:flex;gap:7px;align-items:center}.btn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:9px 13px;font-weight:700}.btn:hover{background:var(--brand2)}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.icon{width:40px;height:40px;padding:0}.wrap{width:min(1180px,calc(100% - 40px));margin:auto;padding:28px 0 50px}.hero{display:grid;grid-template-columns:1.45fr .75fr;gap:18px;margin-bottom:22px}.heroCard{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:31px;box-shadow:var(--shadow)}.eyebrow{text-transform:uppercase;letter-spacing:.1em;font-size:11px;font-weight:850;color:var(--brand);margin-bottom:8px}.h1{font-size:clamp(32px,4.2vw,54px);line-height:1.02;letter-spacing:-.055em;margin:0 0 15px}.lead{font-size:16px;color:var(--muted);line-height:1.65;max-width:680px}.heroActions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:19px}.stat b{font-size:29px;letter-spacing:-.04em;display:block}.stat span{color:var(--muted);font-size:12px}.sectionHead{display:flex;justify-content:space-between;align-items:end;gap:15px;flex-wrap:wrap;margin:28px 0 13px}.sectionHead h2{margin:0;font-size:23px;letter-spacing:-.03em}.small{font-size:12px;color:var(--muted)}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:7px 11px;font-size:12px;font-weight:750}.chip.active{border-color:var(--brand);background:var(--brand2);color:var(--brand)}.feed{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;transition:.15s;box-shadow:0 4px 15px rgba(20,30,60,.03)}.card:hover{transform:translateY(-2px);border-color:var(--brand)}.top{display:flex;justify-content:space-between;gap:8px}.status,.risk{display:inline-flex;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:850}.verified{color:var(--green);background:var(--greenbg)}.unverified{color:var(--amber);background:var(--amberbg)}.disputed{color:var(--red);background:var(--redbg)}.needs{color:var(--blue);background:var(--bluebg)}.riskHigh{color:var(--red);background:var(--redbg)}.riskMedium{color:var(--amber);background:var(--amberbg)}.riskLow{color:var(--blue);background:var(--bluebg)}.claim{font-weight:780;font-size:16px;line-height:1.42;margin:14px 0 10px}.meta{color:var(--muted);font-size:11px;display:flex;gap:7px;flex-wrap:wrap}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}.tag{border:1px solid var(--line);border-radius:7px;padding:4px 7px;font-size:10px;color:var(--muted)}.empty{grid-column:1/-1;text-align:center;border:1px dashed var(--line);padding:50px;border-radius:18px;color:var(--muted)}.workflow{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:15px}.flow{padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font-size:12px}.flow b{display:block;margin-bottom:5px}.modal{position:fixed;inset:0;background:rgba(8,12,22,.5);z-index:30;display:grid;place-items:center;padding:20px}.dialog{width:min(720px,100%);max-height:90vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:var(--shadow)}.modalHead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.modalHead h2{margin:8px 0 0;font-size:25px;letter-spacing:-.035em}.x{border:0;background:transparent;color:var(--muted);font-size:28px}.form{display:grid;gap:14px;margin-top:18px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--text);outline:none}.field textarea{min-height:130px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand2)}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.checks{display:flex;gap:7px;flex-wrap:wrap}.check{border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:11px;color:var(--muted)}.note{padding:12px 14px;border-radius:12px;background:var(--brand2);color:var(--muted);font-size:12px;line-height:1.5}.actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:4px}.evidence{border:1px solid var(--line);border-radius:13px;padding:14px;color:var(--muted);font-size:13px;line-height:1.55}.timeline{display:grid;gap:11px}.event{display:flex;gap:10px}.dot{width:26px;height:26px;border-radius:50%;background:var(--brand2);color:var(--brand);display:grid;place-items:center;font-size:11px;font-weight:900;flex:none}.reviewGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.reviewBox{border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--surface)}.reviewBox b{display:block;margin-bottom:7px}.reviewList{display:grid;gap:11px;margin-top:15px}.footer{border-top:1px solid var(--line);margin-top:28px;padding-top:15px;color:var(--muted);font-size:11px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
@media(max-width:900px){.hero{grid-template-columns:1fr}.feed{grid-template-columns:repeat(2,minmax(0,1fr))}.workflow{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.nav{padding:0 14px}.navlinks .navText{display:none}.wrap{width:min(100% - 24px,1180px);padding-top:17px}.feed,.two,.reviewGrid{grid-template-columns:1fr}.heroCard{padding:22px}.stats{gap:8px}.stat{padding:14px}.h1{font-size:34px}.navlinks{gap:3px}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const state={theme:localStorage.getItem("tl-theme")||"light",view:"feed",filter:"All",sort:"priority"};
let claims=[
{id:1,status:"Needs context",risk:"High",category:"Politics",platform:"WhatsApp",time:"12 min ago",flags:["Breaking","Share before reading"],claim:"A viral message says a new national rule takes effect tomorrow and requires every citizen to complete an online form.",evidence:"The claim has not yet been matched to an official government notification. Reviewers should verify the issuing authority, date and original document.",reviewer:"Unassigned"},
{id:2,status:"Verified",risk:"Medium",category:"Health",platform:"Instagram",time:"34 min ago",flags:["Sensational"],claim:"A post claims that a common kitchen ingredient can completely prevent seasonal flu.",evidence:"Available public-health guidance does not support the claim as stated. The post mixes a general wellness observation with an unsupported prevention claim.",reviewer:"A. Mehta"},
{id:3,status:"Disputed",risk:"High",category:"Finance",platform:"X",time:"1 hr ago",flags:["Shocking","Breaking"],claim:"A viral screenshot claims a major bank has frozen all digital transfers for the next 48 hours.",evidence:"The screenshot could not be corroborated through the bank’s published notices. The wording and formatting also differ from recent official communications.",reviewer:"R. Singh"},
{id:4,status:"Unverified",risk:"Low",category:"Other",platform:"Facebook",time:"2 hrs ago",flags:["Share before reading"],claim:"A community post says a city library is giving away free annual memberships this weekend.",evidence:"No independent confirmation has been added yet. This remains visible as an unverified claim so readers can distinguish it from reviewed information.",reviewer:"Unassigned"},
{id:5,status:"Verified",risk:"Low",category:"Other",platform:"Instagram",time:"3 hrs ago",flags:[],claim:"A viral post says the city will host a public clean-up drive this Saturday morning.",evidence:"The event details match the organizer’s published announcement, including location and date.",reviewer:"N. Kapoor"}
];
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function status(s){return `<span class="status ${s==="Verified"?"verified":s==="Disputed"?"disputed":s==="Needs context"?"needs":"unverified"}">● ${esc(s)}</span>`}
function risk(r){return `<span class="risk ${r==="High"?"riskHigh":r==="Medium"?"riskMedium":"riskLow"}">${esc(r)} risk</span>`}
function card(c,review=false){return `<article class="card" data-id="${c.id}"><div class="top">${status(c.status)}${risk(c.risk)}</div><div class="claim">${esc(c.claim)}</div><div class="meta">${esc(c.platform)} · ${esc(c.category)} · ${esc(c.time)}</div><div class="tags">${c.flags.length?c.flags.map(f=>`<span class="tag">⚑ ${esc(f)}</span>`).join(""):`<span class="tag">No risk flags</span>`}</div>${review?`<div class="actions" style="justify-content:flex-start;margin-top:13px"><button class="btn primary openReview" data-id="${c.id}">Open review</button></div>`:""}</article>`}
function render(){
document.documentElement.dataset.theme=state.theme;
const pending=claims.filter(c=>c.status!=="Verified"&&c.status!=="Disputed");
const filtered=claims.filter(c=>state.filter==="All"||c.category===state.filter).sort((a,b)=>state.sort==="priority"?((b.risk==="High")-(a.risk==="High"))||a.id-b.id:b.id-a.id);
document.getElementById("app").innerHTML=`
<header class="nav"><div class="brand"><div class="logo">✓</div><span>TruthLens</span></div><div class="navlinks"><button class="btn navText" data-view="feed">Public feed</button><button class="btn navText" data-view="review">Review queue</button><button class="btn primary" id="submit">+ Submit claim</button><button class="btn icon" id="theme" title="Toggle light/dark theme">${state.theme==="light"?"☼":"☾"}</button></div></header>
<main class="wrap">
${state.view==="feed"?`
<section class="hero"><div class="heroCard"><div class="eyebrow">Civic intelligence · neutral by design</div><h1 class="h1">See what needs checking before it spreads.</h1><p class="lead">TruthLens helps newsrooms and citizen groups triage viral claims. It separates <b>what was submitted</b> from <b>what has actually been reviewed</b>—without treating virality as truth.</p><div class="heroActions"><button class="btn primary" id="heroSubmit">Submit a viral claim →</button><button class="btn" data-view="review">Open reviewer workspace</button></div></div><div class="stats"><div class="stat"><b>128</b><span>claims triaged</span></div><div class="stat"><b>23</b><span>awaiting review</span></div><div class="stat"><b>17</b><span>high-risk today</span></div><div class="stat"><b>4.8m</b><span>estimated reach</span></div></div></section>
<div class="sectionHead"><div><div class="eyebrow">Public claim feed</div><h2>What the community is checking</h2><div class="small">Risk + recency ordering · unverified claims remain clearly labelled</div></div><div class="toolbar"><div class="chips">${["All","Politics","Health","Finance","Other"].map(x=>`<button class="chip ${state.filter===x?"active":""}" data-filter="${x}">${x}</button>`).join("")}</div><button class="chip" id="sort">Order: ${state.sort==="priority"?"risk + recency":"recency"}</button></div></div>
<div class="feed">${filtered.length?filtered.map(c=>card(c)).join(""):`<div class="empty">No claims match this filter.</div>`}</div>
<div class="sectionHead"><div><div class="eyebrow">Transparent workflow</div><h2>From signal to review</h2></div></div><div class="workflow"><div class="flow"><b>01 · Submit</b><span class="small">Claim, source, category and risk signals.</span></div><div class="flow"><b>02 · Triage</b><span class="small">Recent and high-risk signals surface first.</span></div><div class="flow"><b>03 · Review</b><span class="small">Evidence is checked by a reviewer.</span></div><div class="flow"><b>04 · Publish status</b><span class="small">Verified, disputed or needs context.</span></div></div>
`:`
<div class="sectionHead"><div><div class="eyebrow">Reviewer workspace</div><h2>Review queue</h2><div class="small">Work from evidence, not engagement. Original submissions remain preserved.</div></div><button class="btn" data-view="feed">← Back to public feed</button></div>
<div class="reviewGrid"><div class="reviewBox"><b>Needs attention</b><strong style="font-size:29px">${pending.length}</strong><div class="small">claims awaiting a decision</div></div><div class="reviewBox"><b>Decision model</b><div class="small">Submitted → Reviewing → Verified / Disputed / Needs context</div></div></div>
<div class="reviewList">${pending.map(c=>card(c,true)).join("")}</div>
`}
<footer class="footer"><span>TruthLens · Neutral by design · Information is reviewed, not ideology.</span><span>Demo data · local-only MVP</span></footer>
</main>`;
bind();
}
function bind(){
document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{state.view=b.dataset.view;render()});
document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;render()});
document.querySelectorAll(".card[data-id]").forEach(b=>b.onclick=e=>{if(!e.target.closest("button"))detail(+b.dataset.id)});
document.querySelectorAll(".openReview").forEach(b=>b.onclick=e=>{e.stopPropagation();review(+b.dataset.id)});
document.getElementById("submit")?.addEventListener("click",submitModal);
document.getElementById("heroSubmit")?.addEventListener("click",submitModal);
document.getElementById("sort")?.addEventListener("click",()=>{state.sort=state.sort==="priority"?"recent":"priority";render()});
document.getElementById("theme")?.addEventListener("click",()=>{state.theme=state.theme==="light"?"dark":"light";localStorage.setItem("tl-theme",state.theme);render()});
}
function showModal(content){document.body.insertAdjacentHTML("beforeend",`<div class="modal" id="modal"><div class="dialog">${content}</div></div>`);document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")closeModal()}}
function closeModal(){document.getElementById("modal")?.remove()}
function detail(id){const c=claims.find(x=>x.id===id);showModal(`<div class="modalHead"><div>${status(c.status)} ${risk(c.risk)}<h2>Claim detail</h2></div><button class="x" id="x">×</button></div><div class="form"><div><div class="claim">${esc(c.claim)}</div><div class="meta">Source: ${esc(c.platform)} · ${esc(c.category)} · Submitted ${esc(c.time)}</div></div><div><div class="eyebrow">Risk signals</div><div class="tags">${c.flags.length?c.flags.map(f=>`<span class="tag">⚑ ${esc(f)}</span>`).join(""):`<span class="tag">No risk flags</span>`}</div></div><div><div class="eyebrow">Evidence & review note</div><div class="evidence">${esc(c.evidence)}</div></div><div><div class="eyebrow">Review history</div><div class="timeline"><div class="event"><div class="dot">1</div><div><b>Submitted</b><div class="small">Original claim received from ${esc(c.platform)}</div></div></div><div class="event"><div class="dot">2</div><div><b>Risk triage</b><div class="small">${esc(c.risk)} risk based on submitted signals</div></div></div><div class="event"><div class="dot">3</div><div><b>Current status</b><div class="small">${esc(c.status)} · Reviewer: ${esc(c.reviewer)}</div></div></div></div></div><div class="actions"><button class="btn" id="close">Close</button><button class="btn primary" id="toReview">Open review</button></div></div>`);document.getElementById("x").onclick=closeModal;document.getElementById("close").onclick=closeModal;document.getElementById("toReview").onclick=()=>review(id)}
function review(id){const c=claims.find(x=>x.id===id);showModal(`<div class="modalHead"><div><div class="eyebrow">Review decision</div><h2>${esc(c.category)} claim</h2></div><button class="x" id="x">×</button></div><form class="form" id="reviewForm"><div class="evidence"><b>${esc(c.claim)}</b><br><span class="small">${esc(c.platform)} · ${esc(c.time)}</span></div><div class="field"><label>Evidence / reviewer note</label><textarea id="note">${esc(c.evidence)}</textarea></div><div class="field"><label>Decision</label><div class="checks">${["Verified","Disputed","Needs context"].map(x=>`<label class="check"><input type="radio" name="decision" value="${x}" ${c.status===x?"checked":""}> ${x}</label>`).join("")}</div></div><div class="note">Saving changes the public status, while preserving the original submission and review history.</div><div class="actions"><button type="button" class="btn" id="cancel">Cancel</button><button class="btn primary">Save review</button></div></form>`);document.getElementById("x").onclick=closeModal;document.getElementById("cancel").onclick=closeModal;document.getElementById("reviewForm").onsubmit=e=>{e.preventDefault();c.status=document.querySelector('input[name="decision"]:checked').value;c.evidence=document.getElementById("note").value.trim()||c.evidence;c.reviewer="Demo reviewer";closeModal();state.view="review";render()}}
function submitModal(){showModal(`<div class="modalHead"><div><div class="eyebrow">New triage</div><h2>Submit a viral claim</h2></div><button class="x" id="x">×</button></div><form class="form" id="submitForm"><div class="field"><label>Claim or viral post</label><textarea id="claimText" required placeholder="Paste the text of the claim here…"></textarea></div><div class="two"><div class="field"><label>Source platform</label><select id="platform"><option>WhatsApp</option><option>Instagram</option><option>X</option><option>Facebook</option><option>Other</option></select></div><div class="field"><label>Category</label><select id="category"><option>Politics</option><option>Health</option><option>Finance</option><option>Other</option></select></div></div><div class="field"><label>Risk flags</label><div class="checks">${["Breaking","Shocking","Share before reading","Deleted","Sensational"].map(x=>`<label class="check"><input type="checkbox" value="${x}"> ${x}</label>`).join("")}</div></div><div class="note">Unverified submissions are visible with an explicit status label. TruthLens does not equate virality with truth.</div><div class="actions"><button type="button" class="btn" id="cancel">Cancel</button><button class="btn primary">Submit for triage</button></div></form>`);document.getElementById("x").onclick=closeModal;document.getElementById("cancel").onclick=closeModal;document.getElementById("submitForm").onsubmit=e=>{e.preventDefault();const text=document.getElementById("claimText").value.trim();if(!text)return;const flags=[...document.querySelectorAll('#submitForm input[type="checkbox"]:checked')].map(x=>x.value);claims.unshift({id:Date.now(),status:"Unverified",risk:flags.length>=2?"High":flags.length?"Medium":"Low",category:document.getElementById("category").value,platform:document.getElementById("platform").value,time:"just now",flags,claim:text,evidence:"Awaiting independent evidence review.",reviewer:"Unassigned"});closeModal();state.view="feed";state.filter="All";render()}}
render();
</script>
</body>
</html>
